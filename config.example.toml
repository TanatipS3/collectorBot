# แม่แบบการตั้งค่า collectorBot สำหรับเว็บไซต์ใหม่
#
#   1. คัดลอกไฟล์นี้เป็นชื่อใหม่ เช่น  mysite.toml
#   2. แก้ค่าที่มีเครื่องหมาย  ← แก้
#   3. ทดลองรันสั้น ๆ:   python -m collector -c mysite.toml crawl --limit 50
#   4. ดูผล:            python -m collector -c mysite.toml status
#
# regex ในไฟล์นี้ใช้ '...' (literal string ของ TOML) จะได้ไม่ต้องเขียน \ ซ้ำสองตัว
# ไม่ต้องใส่ทุกค่า: ค่าที่ไม่ใส่จะใช้ค่าเริ่มต้นตามที่เขียนไว้ด้านล่าง

# ← แก้: หน้าที่ใช้เริ่มต้น เช่น หน้าแรก หน้ารวมเอกสาร หน้าดาวน์โหลด (ใส่ได้หลายหน้า)
start_urls = [
    "https://www.example.go.th/",
]

# ← แก้: โฮสต์ที่จะเปิดหน้า HTML อ่านหาลิงก์ต่อ
#   "*.example.go.th" = ทุกโดเมนย่อย (ระวัง: บางเว็บมีระบบย่อยใหญ่มาก)
crawl_hosts = ["www.example.go.th"]

# ← แก้: โฮสต์ที่อนุญาตให้ดาวน์โหลดเอกสาร ควรรวมโฮสต์ใน crawl_hosts ไว้ด้วย
#   ถ้าเว็บเก็บไฟล์ไว้ที่ CDN หรือโดเมนอื่น ให้เพิ่มโฮสต์นั้นที่นี่ (ไม่ต้องเพิ่มใน crawl_hosts)
file_hosts = ["*.example.go.th"]

# ← แก้: regex ของ URL ที่ไม่ต้องเข้าเลย ใช้ตัดหน้าที่ไม่มีเอกสาร หรือหน้าที่วนไม่รู้จบ
#   (ช่องค้นหา, login, ปฏิทินที่กดเดือนถัดไปได้เรื่อย ๆ, การเรียงลำดับ/ตัวกรอง, ตัวนับคลิก)
exclude = [
    '/search', '[?&](q|keyword|search)=', '/login', 'logout',
    # '[?&](sort|order|filter)=',
    # '/calendar/',
]

# ที่เก็บไฟล์และสถานะ: ใช้ชื่อแยกต่อเว็บ จะได้ไม่ปนกับการเก็บเว็บอื่น
output_dir = "downloads_mysite"   # ← แก้
state_dir = "state_mysite"        # ← แก้

# ---------- ใช้เมื่อเว็บมีลิงก์แบบพิเศษ (ส่วนใหญ่ไม่ต้องแก้) ----------

# ลิงก์เอกสารที่ซ่อนอยู่ในการเรียก JavaScript ให้ regex หาแล้วสร้าง URL ให้
#   find = regex ที่หาในซอร์ส HTML ของหน้า,  url = แม่แบบ URL โดย {1} {2} ... คือกลุ่ม (...) ใน regex
#   ตัวอย่าง: <button onclick="openDoc(42, 'report.pdf')">  →  /docs/42/report.pdf
link_rules = [
    # { find = '''openDoc\((\d+),\s*'([^']+)'\)''', url = "/docs/{1}/{2}" },
]

# กฎเฉพาะเว็บที่เขียนเป็น Python (ไฟล์ collector/sites/<ชื่อ>.py) สำหรับสิ่งที่ regex ทำไม่ได้
#   "" = ไม่ใช้, "senate" = กฎของเว็บวุฒิสภา (ดูเป็นตัวอย่างได้)
site = ""

# URL บนโฮสต์ใน crawl_hosts ที่รู้แน่ว่าเป็นลิงก์ดาวน์โหลด (ไม่มีนามสกุลไฟล์) ให้เข้าคิวดาวน์โหลดเลย
#   ไม่ใส่ก็ยังได้ไฟล์ เพราะระบบดูจาก Content-Type อยู่แล้ว แค่จะไปรอในคิวหน้าเว็บแทน
crawl_host_download_patterns = [
    # '[?&]dl=\d',
]

# URL ดาวน์โหลดที่ไม่มีนามสกุลไฟล์ บนโฮสต์ใน file_hosts ที่ไม่ได้อยู่ใน crawl_hosts
# download_patterns = ['download', '[?&]dl=', 'getfile', 'fileid=']   # ค่าเริ่มต้น

# ชนิดไฟล์ที่จะเก็บเพิ่ม นอกจากเอกสารมาตรฐาน (pdf, doc(x), xls(x), ppt(x), odt, rtf, epub, zip, rar, ...)
extra_file_exts = [
    # "txt", "xml", "jpg",
]

# ---------- ความสุภาพต่อเซิร์ฟเวอร์ (ค่าเริ่มต้นปลอดภัยแล้ว) ----------
workers = 4          # จำนวนเธรดดาวน์โหลด (รวมทุกโฮสต์)
delay = 1.0          # วินาทีระหว่างสองคำขอที่ไปยังโฮสต์เดียวกัน
max_per_host = 2     # จำนวนดาวน์โหลดที่เปิดพร้อมกันต่อโฮสต์
pages_per_host = 1   # จำนวนคำขอหน้าเว็บพร้อมกันต่อโฮสต์ (นอกเหนือจากดาวน์โหลด)
max_delay = 60       # ถ้าเซิร์ฟเวอร์เริ่มรับไม่ไหว ระยะห่างจะเพิ่มเป็นสองเท่าได้ถึงค่านี้
timeout = 60         # วินาทีที่รอคำตอบจากเซิร์ฟเวอร์
max_retries = 3      # ลองซ้ำในรอบเดียวกันเมื่อเจอ 429/502/503/504/timeout
max_file_mb = 0      # ข้ามไฟล์ที่ใหญ่กว่านี้ (0 = ไม่จำกัด)
respect_robots = true  # ทำตาม robots.txt ของเว็บ

# user_agent = "Mozilla/5.0 (compatible; collectorBot/0.1; document archiver)"
# accept_language = "th,en;q=0.8"   # ภาษาที่ขอจากเว็บ เช่น "en" สำหรับเว็บภาษาอังกฤษ
